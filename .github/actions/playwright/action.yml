name: Playwright's browsers
description: >-
  Playwright's browsers for the engines named, cached by Playwright's version and the engines, and the system packages
  they need, each install in three tries (D-123, D-126, D-224, D-299). Run after npm ci.
inputs:
  engines:
    description: The engines, space separated (chromium, webkit, firefox).
    required: true
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ inputs.engines }}
    # apt can hang for as long as the job has when the runner cannot reach Ubuntu's mirrors: two jobs sat here for 15
    # and 19 minutes on 11 November 2026 (D-123). Each try is stopped after a few minutes, and there are three. With the
    # browsers cached only their system packages are installed, so a try is given three minutes, not five.
    - shell: bash
      env:
        ENGINES: ${{ inputs.engines }}
        CACHED: ${{ steps.cache.outputs.cache-hit }}
      run: |
        read -r -a engines <<<"$ENGINES"
        if [ "$CACHED" = true ]; then
          what="Playwright's system packages"; limit=180; install=(npx playwright install-deps "${engines[@]}")
        else
          what="Playwright's browsers and their system packages"; limit=300; install=(npx playwright install --with-deps "${engines[@]}")
        fi
        for try in 1 2 3; do
          # `timeout` stops npx, not the apt-get it started as root, so a try waits up to five minutes for the last
          # one's apt-get to let go of dpkg's lock before it starts (CI run 44194833317, oldest; D-224).
          timeout 300 bash -c 'while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do sleep 5; done' || true
          if timeout "$limit" "${install[@]}"; then exit 0; fi
          echo "::warning::Try ${try} of ${what} did not finish."
          # What the try left can keep dpkg's lock for the next to fail on (#64): stop it, and finish any package it
          # left half set up.
          sudo pkill -x apt-get || true
          sudo pkill -x dpkg || true
          sudo dpkg --configure -a || true
          # Only after a try has failed: the hosted runners use Azure's mirror, and Ubuntu's own may answer when it does
          # not (D-126).
          grep -rl azure.archive.ubuntu.com /etc/apt | xargs -r sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' || true
          sleep 30
        done
        exit 1
