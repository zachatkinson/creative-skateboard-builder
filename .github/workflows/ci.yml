name: CI

# Every gate on every push to main and every pull request (docs/AUDIT.md: CI gates), once for each state of the code: a
# full run that passed is not repeated on the same code (D-188). A change to the docs alone runs nothing. A version tag runs nothing either: release.yml publishes once this workflow has passed on the tagged
# commit's push to main. Every action is pinned to a commit SHA (docs/STANDARDS.md: CI hygiene).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  pull_request:
    # ready_for_review as well as the defaults: marking a draft ready is what starts its full run (D-041).
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**.md', 'LICENSE']

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; each push to main keeps its own run, which a release
# waits for. A pull request's queue is its number, never its ref: a run that starts after the merge is given
# refs/heads/main, and in main's queue it cancelled the merge's own run (CI run 43610439862, issue #41; D-188).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A draft pull request, and one that touches only the browser tests, runs the standards, the unit tests and the
  # newest leg, not the other legs, mutation testing or the release dry run. A change to a workflow takes the full
  # run: it is what can break the other legs, and Dependabot's bumps of the actions are such changes (D-043). Main runs
  # everything but what a full run has passed on the same code (D-188); a release waits for it.
  # The secrets scan rides in the same job: both need the history and neither takes ten seconds, and every job is
  # billed to the whole minute (D-040). A secret found stops the jobs that wait for this one.
  #
  # The code a full run has passed is not run again (D-188). The code is every file but the ones `paths-ignore` leaves
  # out (docs/, Markdown, LICENSE), hashed by their paths and contents. A full run uploads a marker named for that hash;
  # a later run whose code hashes the same, and whose marker's run passed, runs the standards and the unit tests and
  # skips the legs and mutation testing. That is a push to main of a merge whose pull request passed on the same main,
  # and a pull request's push of docs alone after a full run. A pull request that is no longer open runs nothing heavy:
  # its run started after the merge (issue #41).
  scope:
    name: What this change runs, and the secrets scan (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # gitleaks lists the pull request's commits to scan them, which the workflow's contents-only token may not do.
    # The markers are other runs' artifacts, and their runs' conclusions, which need actions: read.
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the pull request's commits; the scope step reads its state
      actions: read # the code-passed markers are other runs' artifacts
    outputs:
      full: ${{ steps.scope.outputs.full }}
      browsers: ${{ steps.scope.outputs.browsers }}
      legs: ${{ steps.scope.outputs.legs }}
      shards: ${{ steps.scope.outputs.shards }}
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.base_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          full=true
          browsers=every
          if [ "${GITHUB_EVENT_NAME}" = pull_request ] && [ "${DRAFT}" = true ]; then
            # A draft is work in progress: the lighter run on each push, everything once it is marked ready (D-041).
            # GitHub does not merge a draft, so nothing reaches main without the full run. Its newest leg runs one
            # desktop and one phone engine, as the oldest leg does; every project runs once it is ready (D-085).
            full=false
            browsers=two
          elif [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            # The lighter run only when the diff was read and holds nothing else: if git cannot say, everything runs.
            if changed=$(git diff --name-only "origin/${BASE}...HEAD"); then
              others=$(grep -Ev '^(tests/e2e/|docs/|LICENSE$)|\.md$' <<<"$changed" || true)
              if [ -n "$changed" ] && [ -z "$others" ]; then
                full=false
              fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          # The legs' jobs, each on the one wp-env site it needs (#76, D-298), and none much past 20 minutes (D-300):
          # its check's name, its WordPress pair, its part, its site and, for a browser part, its Playwright projects
          # and engines. Where every project runs, newest runs Chromium's desktop and phone apart, and the `browsers`
          # job the rest; where they don't (a draft, or the oldest pair), one desktop and one phone engine (D-085).
          leg() { jq -nc --arg name "$1" --arg pair "$2" --arg part "$3" --arg site "$4" --arg projects "${5:-}" --arg engines "${6:-}" '$ARGS.named'; }
          # The newest integration suite is not a leg: it runs in shards, in the `suite` job (D-323).
          legs=(
            "$(leg 'The benchmarks at 2,000 parts (newest)' newest benchmarks tests)"
            "$(leg 'Lighthouse CI (newest)' newest lighthouse browser)"
          )
          if [ "$browsers" = every ]; then
            legs+=(
              "$(leg 'Plugin Check, the zip, browser (newest)' newest browser browser '--project=chromium-desktop' chromium)"
              "$(leg 'Browser (newest, chromium phone)' newest phone browser '--project=chromium-phone' chromium)"
            )
          else
            legs+=("$(leg 'Plugin Check, the zip, browser (newest)' newest browser browser '--project=chromium-desktop --project=webkit-phone' 'chromium webkit')")
          fi
          if [ "$full" = true ]; then
            legs+=(
              "$(leg 'Integration (oldest)' oldest integration tests)"
              "$(leg 'Plugin Check, the zip, browser (oldest)' oldest browser browser '--project=chromium-desktop --project=webkit-phone' 'chromium webkit')"
              "$(leg 'Integration (variants: MySQL 8.4, MariaDB 10.11, HPOS off)' variants databases tests)"
              "$(leg 'Integration (variants: HPOS syncing, object cache, Yoast, multisite)' variants the-rest tests)"
            )
          fi
          {
            echo "legs=$(printf '%s\n' "${legs[@]}" | jq -sc .)"
            # The newest integration suite's shards, 1 to the count tools/integration-shards.json gives (D-323).
            echo "shards=$(jq -c '[range(1; .shards + 1)]' tools/integration-shards.json)"
            echo "browsers=$browsers"
          } >> "$GITHUB_OUTPUT"
          echo "Full run: $full; browser projects: $browsers"
          code="$(bash tools/ci-code-hash.sh)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          heavy=true
          state=open
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            # Open unless the API says otherwise: a call that fails runs everything, never less.
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .state 2>/dev/null || echo open)"
          fi
          if [ "$state" != open ]; then
            echo "Pull request #${PR} is no longer open: this run started after it closed, and runs nothing heavy."
            heavy=false
          elif passed="$(bash tools/ci-code-passed.sh "$code")"; then
            echo "This code (${code}) passed the full run ${passed}: the legs and mutation testing are not run again."
            heavy=false
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          # A marker only from a run that does all of it: its run's conclusion says whether it passed.
          if [ "$heavy" = true ] && [ "$full" = true ] && [ "$browsers" = every ]; then
            echo "marker=true" >> "$GITHUB_OUTPUT"
            mkdir -p tmp && echo "$code" > tmp/code-hash.txt
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.scope.outputs.marker == 'true'
        with:
          name: passed-code-${{ steps.scope.outputs.code }}
          path: tmp/code-hash.txt
          retention-days: 30
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The workflows' own lint (#74, D-299), here beside the secrets scan, for the same reason: seconds, and nothing
      # waits on it but what needs this job. actionlint checks the syntax, the expressions and, with ShellCheck, every
      # run script; zizmor checks them for security at its pedantic persona, with its online audits. Each is its
      # release's binary at a pinned version and checksum (tools/workflow-lint.sh): the repository allows GitHub's own
      # actions and three named ones, so neither tool is an action.
      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/workflow-lint.sh

  static:
    name: Lint, analyse, architecture, gates, unit tests, API snapshot, audits, benchmarks, PHP 7.4 parse
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer lint
      - run: composer analyse
      - run: composer arch
      - run: composer gates
      - name: Unit tests with the domain's coverage floors (100 % of src/Domain's lines and branches)
        run: composer test:coverage
      - run: composer api:check
      # The audits read the three lock files, so nothing more has to be installed for them.
      - run: composer audit:deps
      - name: Benchmarks (the server budgets are tests)
        run: composer test:benchmark
      # The main file, uninstall.php and the floors check must parse on PHP 7.4, the oldest PHP WordPress 7.0 runs on,
      # so a host below the floor sees the notice and no parse error (D-023). The 8.5- PHPCompatibility run cannot flag
      # 8.5-only syntax in them. Last, since it replaces the job's PHP.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
      - name: The main file parses on PHP 7.4
        run: |
          php -v | head -n 1 | grep -F 'PHP 7.4'
          php -l creative-skateboard-builder.php
          php -l uninstall.php
          php -l src/Support/Requirements.php
          # Below the floors uninstall.php loads these four itself, past the autoloader (D-043).
          php -l src/Install/Sites.php
          php -l src/Support/Options.php
          php -l src/Support/Tables.php
          php -l src/Install/Uninstaller.php
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage
          path: tmp/coverage.txt

  js:
    name: TypeScript, JavaScript and CSS standards; generated types; the asset budgets
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The generated types are committed
        # git status, not git diff: a types file never committed is untracked, and a diff does not show it.
        run: |
          npm run types
          changed="$(git status --porcelain -- assets/src)"
          if [ -n "$changed" ]; then
            echo "The generated types differ from the committed ones:"; echo "$changed"; exit 1
          fi
      - run: npm run check
      - run: npm run build
      - run: npm run budget

  mutation:
    name: Mutation testing (Infection and StrykerJS), and the release dry run
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    # Everything on main takes Infection 11 to 14 minutes on this runner, and Stryker and the dry run two more. At
    # 15 the job was cancelled on 0.3.1's merge with nothing wrong, and the release waited on a second run (D-107).
    # At 25 it was cancelled again at 25:16 on #173, with StrykerJS at 4,103 mutants after the 3D view (D-541).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request mutates the lines it changes, against its base branch. Quoted: a bare 0 is falsy in an
          # expression, so `&& 0 || 1` would always be 1 and the base branch never fetched.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # The same two configurations and floors either way (95 % outside the domain, 100 % inside it); a pull request
      # applies them to its changed lines, and passes when it changed none they mutate. Main runs everything.
      - name: Infection (a pull request's changed lines; everything on main)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Every core the runner has: nothing else runs beside it here, and Infection's own "max" keeps one back,
          # which left one thread and an 8 to 14 minute run on main (D-107).
          CBUILD_INFECTION_THREADS="$(nproc)"
          export CBUILD_INFECTION_THREADS
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            bash tools/infection.sh --git-diff-lines "--git-diff-base=origin/${BASE}" --ignore-msi-with-no-mutations
          else
            composer infection
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: StrykerJS on the builder's store (95 %; skipped while assets/src has no TypeScript)
        run: npm run mutate:js
      # Everything release.yml does short of publishing (tools/release-dry-run.sh): the zip, the SBOMs from their
      # pinned tools, and the manifest read back by the updater's own class. release.yml runs only on a tag, so without
      # this a broken step would first be met by a release. It runs whatever mutation testing found.
      - name: Release dry run (zip, SBOMs, manifest)
        if: ${{ !cancelled() }}
        run: bash tools/release-dry-run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: infection-logs
          path: tmp/infection*.log

  # The matrix (docs/AUDIT.md: The platform; D-004, D-040): the newest and oldest WordPress and WooCommerce pairs on
  # PHP 8.5, each with the browser projects, Plugin Check and the zip's lifecycle; and one leg that runs the
  # integration suite six more times on one wp-env (tools/integration-variants.sh): MySQL 8.4 and MariaDB 10.11 as
  # their own database servers, HPOS off and syncing, a persistent object cache, and multisite, and then the tests that
  # need Yoast SEO, alone (D-102).
  # Each pair's leg is two jobs (#76, D-298): its integration half starts the integration site alone (:8899) and runs
  # the PHP suites; its browser half starts the browser site alone (:8898) and runs the rest. The newest leg did both
  # in one job, 44 minutes, which set the length of every full run.
  integration:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    # Every browser project is some 790 tests: 45 minutes of the newest leg on a quick runner and 70 on a slow one,
    # after 20 of setup and gates. At 90 the merge of 0.6.0 was cancelled with every test passing, and was run again
    # (CI run 43610439862, D-188); a minute not used is not billed. The other legs, and a draft's newest, take about
    # 25 minutes since milestone 7; at 30 a slow runner stopped the oldest leg with its browser tests still running
    # (CI run 43906165176). At 45 a slow runner fits and a hang still stops at less than the newest leg's limit.
    # Since D-258 the newest leg runs Chromium's two projects alone, and the `browsers` job the rest beside it, so
    # every leg takes about what the oldest does. With milestone 14's 3D tests the oldest leg's 804 tests took 44 and
    # 55 minutes, and on #173 a slow runner stopped it at 60 with 704 done and none failed (D-544).
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pin the oldest supported WordPress and WooCommerce
        if: matrix.pair == 'oldest'
        run: npm run env:oldest
      # The browser site (:8898) and the integration site (:8899) are two wp-env environments (D-047); each half starts
      # its own. The newest pair's integration suite, with Xdebug in coverage mode, is the `suite` job's (D-323).
      - name: The integration site
        if: matrix.site == 'tests'
        run: bash tools/wp-env.sh start --config=.wp-env.tests.json
      - name: The browser site
        if: matrix.site == 'browser'
        run: bash tools/wp-env.sh start
      # The POT is made in the browser site's CLI.
      - name: The i18n check (the POT current, the translations complete)
        if: matrix.pair == 'newest' && matrix.part == 'browser'
        run: composer i18n:check
      # The oldest pair's integration suite, whole: without coverage it runs in about three minutes, so a split would
      # save less than a shard's setup costs (D-323).
      - run: composer test:integration
        if: matrix.part == 'integration'
      # 2,000 parts indexed, exported, checked and dry-run, each inside a request: five minutes, so a job of its own
      # beside the suite (D-300). A shared runner's speed moves from run to run, so here the budgets are scaled by how
      # much slower than the Mac the runner does a fixed piece of work, at most 2.5 times, and the query counts are held
      # as anywhere (D-124, D-171).
      - name: The benchmarks at 2,000 parts (Xdebug off)
        if: matrix.part == 'benchmarks'
        env:
          CBUILD_BENCHMARK_SHARED: '1'
        run: composer test:benchmark:integration
      # Two halves, about ten minutes each (D-300): the two database servers and HPOS off; HPOS syncing, the object
      # cache, the Yoast tests and multisite.
      - name: The integration suite's variants
        if: matrix.pair == 'variants'
        env:
          HALF: ${{ matrix.part }}
        run: bash tools/integration-variants.sh "$HALF"
      - run: npm run plugin-check
        if: matrix.part == 'browser'
      - name: The zip installs, upgrades over itself and uninstalls clean
        if: matrix.part == 'browser'
        run: npm run zip-lifecycle
      # The browsers are cached by Playwright's version and the engines; the system packages they need are installed
      # each time.
      - uses: ./.github/actions/playwright
        if: matrix.projects != ''
        with:
          engines: ${{ matrix.engines }}
      # The previous release, as published, updated to this build through the upload screen's "Replace current with
      # uploaded", after a check that its container builds every service from these files (Cowork's M7 review, F3;
      # D-208). It needs Playwright's Chromium, so it comes after the install; the browser projects' setup seeds the
      # site again after it, as after the zip's lifecycle.
      - name: The update from the previous release, through the upload screen
        if: matrix.part == 'browser'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run upgrade
      - name: The browser projects
        if: matrix.projects != ''
        env:
          PROJECTS: ${{ matrix.projects }}
        run: |
          read -r -a projects <<<"$PROJECTS"
          npm run test:e2e -- "${projects[@]}"
      # A job of its own (D-300): four minutes, and a runner with no browser tests on it before it measures.
      - name: Lighthouse CI (LCP, CLS, TBT, SEO on the mobile profile)
        id: lhci
        if: matrix.part == 'lighthouse'
        run: npm run lhci
      # Lighthouse CI prints values only for a gate that failed, so the medians go to the job's summary either way (#74).
      - name: Lighthouse's medians in the job's summary
        if: ${{ !cancelled() && steps.lhci.outcome != 'skipped' && matrix.part == 'lighthouse' }}
        run: php tools/lhci-summary.php tmp/lhci | tee -a "$GITHUB_STEP_SUMMARY"
      # Milestone 11: a Chromium performance trace of each moment, from the browser test that holds them to INP, no
      # layout shift and the compositor (D-306). Kept on every run, passing or not; open one in Chrome's Performance
      # panel.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && contains(matrix.projects, 'chromium') }}
        with:
          retention-days: 14
          name: motion-traces-${{ matrix.pair }}-${{ matrix.part }}
          path: tmp/motion-traces
          if-no-files-found: error
      # On a job that ran out of time as well: a cancelled run prints no failure, so the traces are all there is.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          # Read the day a run fails or the day after; not kept the 90 days GitHub keeps by default (#74).
          retention-days: 14
          name: ${{ matrix.part }}-${{ matrix.pair }}
          path: |
            test-results
            tmp/lhci
      - name: WordPress's debug log
        if: failure()
        env:
          SITE: ${{ matrix.site }}
        run: |
          config=()
          if [ "$SITE" = tests ]; then config=(--config=.wp-env.tests.json); fi
          npx wp-env run cli "${config[@]}" -- bash -c 'cat wp-content/debug.log 2>/dev/null || true'

  # The newest pair's integration suite in shards, a job each, with Xdebug in coverage mode (D-323). The suite was 13 of
  # the newest integration half's 15 minutes, all in one job. tools/integration-shards.php splits its classes by their
  # times in tools/integration-shards.json, the same way in every job, and a class added later lands in a shard by
  # itself. Each shard uploads its coverage report, the bootstrap's lines and a JUnit report of the classes it ran.
  suite:
    name: Integration (newest, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The integration site, with Xdebug in coverage mode
        run: bash tools/wp-env.sh start --config=.wp-env.tests.json --xdebug=coverage
      - name: The shard's part of the integration suite, with coverage
        env:
          CBUILD_SHARD: ${{ matrix.shard }}
          CBUILD_COVERAGE: '1'
        run: bash tools/integration.sh --coverage-clover tmp/coverage-integration.xml --log-junit tmp/integration-junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Read by the next job only.
          retention-days: 3
          name: integration-shard-${{ matrix.shard }}
          path: |
            tmp/coverage-integration.xml
            tmp/coverage-bootstrap.json
            tmp/integration-junit.xml
          if-no-files-found: error
      - name: WordPress's debug log
        if: failure()
        run: npx wp-env run cli --config=.wp-env.tests.json -- bash -c 'cat wp-content/debug.log 2>/dev/null || true'

  # The newest integration suite's required check (D-323): it fails unless every shard passed and uploaded, the shards
  # ran every class of the suite exactly once between them (from their JUnit reports), and the unit suite's lines with
  # the shards' merged reach the 95 % floor on all of src/ (D-050). It runs whatever the shards did, so a shard that
  # failed, or never ran, fails this check rather than leave it skipped.
  suite-merge:
    name: Integration (newest)
    needs: [scope, suite]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.heavy == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.suite.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "The integration suite's shards did not all pass: ${SHARDS}."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: integration-shard-*
          path: tmp/shards
      - name: The shards ran the whole suite, each class once
        run: |
          php tools/integration-shards.php plan
          php tools/integration-shards.php verify tmp/shards
      - name: The 95 % line floor on both suites together
        env:
          CBUILD_COVERAGE_SHARDS: tmp/shards
        run: composer test:coverage:all

  # The newest WordPress and WooCommerce's other browser work, beside the newest leg, where every project runs (D-258).
  # The newest leg did all of it in one job, some 95 minutes, which set the length of every full run; each part is now
  # a job of its own on its own browser site. Each keeps one Playwright worker, since the tests share the site's state.
  # It is skipped where the newest leg runs two projects alone: a draft, and a change only to the browser tests.
  browsers:
    name: Browser (${{ matrix.part }})
    needs: scope
    if: needs.scope.outputs.heavy == 'true' && needs.scope.outputs.full == 'true' && needs.scope.outputs.browsers == 'every'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Split by project, so a test runs as it would in one job (#76, D-298), and no job runs much past 20 minutes
          # (D-300). WebKit is the slowest engine, so each of its projects is a job; Firefox's desktop and tablet, 13
          # minutes together, stay one.
          - part: webkit, desktop
            engines: webkit
            run: npm run test:e2e -- --project=webkit-desktop
          - part: webkit, tablet
            engines: webkit
            run: npm run test:e2e -- --project=webkit-tablet
          - part: webkit, phone
            engines: webkit
            run: npm run test:e2e -- --project=webkit-phone
          - part: firefox, desktop and tablet
            engines: firefox
            run: npm run test:e2e -- --project=firefox-desktop --project=firefox-tablet
          - part: firefox, phone
            engines: firefox
            run: npm run test:e2e -- --project=firefox-phone
          # Four projects were 21 minutes in one job; two each.
          - part: no-js, fr-ca
            engines: chromium
            run: npm run test:e2e -- --project=no-js --project=fr-ca
          - part: rtl, chromium tablet
            engines: chromium
            run: npm run test:e2e -- --project=rtl --project=chromium-tablet
          # Milestone 9: from published releases, each with the shop's data made on it (D-232). Every release took the
          # job past 15 minutes by 1.2.0, so CI runs the sample: every release from 1.0.0 on, and 0.1.0 and 0.9.0
          # (#144, D-414). `npm run upgrade:all` alone still runs every release, on each milestone's combined tree.
          - part: updates
            engines: chromium
            run: npm run upgrade:all -- --sample
          # In Playwright's own Linux image, as locally, so the baselines are one machine's pictures (D-162).
          - part: visual
            engines: ''
            run: bash tools/visual.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run env:start
      # As the legs install them (.github/actions/playwright).
      - uses: ./.github/actions/playwright
        if: matrix.engines != ''
        with:
          engines: ${{ matrix.engines }}
      - name: ${{ matrix.part }}
        env:
          GH_TOKEN: ${{ github.token }}
          PART_RUN: ${{ matrix.run }}
        # The command is the matrix's own, written above; it is passed by env, not pasted into the script.
        run: bash -c "$PART_RUN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || cancelled()
        with:
          # Read the day a run fails or the day after; not kept the 90 days GitHub keeps by default (#74).
          retention-days: 14
          name: browser-newest-${{ strategy.job-index }}
          path: test-results
      - name: WordPress's debug log
        if: failure()
        run: npx wp-env run cli -- bash -c 'cat wp-content/debug.log 2>/dev/null || true'
